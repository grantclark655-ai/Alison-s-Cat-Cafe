<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ed83b2"><title>Alison's Cat Cafe</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#381b36;font-family:Trebuchet MS,Arial,sans-serif;color:#5c284d;touch-action:manipulation}button{font:inherit;cursor:pointer;touch-action:manipulation}#rotate{display:none;position:fixed;inset:0;background:linear-gradient(145deg,#ffb6d7,#fa6ca9);z-index:99;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:25px;font-weight:900;color:white;text-shadow:0 2px 2px #a84979}#game{height:100dvh;width:100vw;position:relative;overflow:hidden;background:linear-gradient(#fff5fa 0 10%,#f8d1e3 10% 52%,#ef9cbe 52% 53%,#f8e6e9 53%);border:5px solid #f7b1d0}#game:before{content:'';position:absolute;inset:10% 0 43%;background:repeating-linear-gradient(0deg,transparent 0 30px,#fff7fa99 30px 32px),repeating-linear-gradient(90deg,transparent 0 48px,#fff7fa88 48px 50px);pointer-events:none}#header{height:11%;position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 1.5%;gap:6px;background:linear-gradient(#fffcfd,#ffe6f1);border-bottom:3px solid #d966a2;box-shadow:0 3px 5px #ab507c44}.brand{font-size:clamp(12px,2.7vw,26px);font-weight:1000;color:#ce397e;text-shadow:1px 2px white;white-space:nowrap}.stats{display:flex;gap:6px;align-items:center}.pill{background:white;border:2px solid #e8a1c2;border-radius:18px;padding:3px 9px;font-weight:900;font-size:clamp(10px,1.4vw,16px);white-space:nowrap;box-shadow:0 2px #d07a9c}.tiny{font-size:clamp(10px,1.25vw,14px)}.btn{background:linear-gradient(#fff,#ffcae1);color:#923b68;border:2px solid #d7669c;border-bottom-width:4px;border-radius:12px;padding:5px 12px;font-weight:900;box-shadow:0 2px 4px #9b507d44}.btn:active,.station:active{transform:translateY(2px)}.gold{background:linear-gradient(#fff3ab,#f5b737);border-color:#b98125;color:#704000}.danger{background:linear-gradient(#fff,#ffc6c6);border-color:#d46d78}.customerZone{position:relative;height:39%;z-index:2;display:flex;align-items:end;justify-content:space-evenly;padding:0 1% 0;background:linear-gradient(transparent 85%,#e889b0 86%,#f6c4d8 89%,#b95e89 100%)}.slot{position:relative;width:19%;height:100%;display:flex;align-items:end;justify-content:center}.customer{width:100%;height:76%;position:relative;display:flex;align-items:end;justify-content:center;animation:arrive .3s ease-out}.customer svg{width:100%;height:100%;filter:drop-shadow(0 3px 2px #7c3c6555)}@keyframes arrive{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}.order{position:absolute;top:-4%;left:50%;transform:translateX(-50%);min-width:95%;max-width:135%;background:#fff;border:3px solid #d86399;border-radius:12px;padding:3px 5px;box-shadow:0 3px #a95b85;z-index:4;text-align:center;font-size:clamp(9px,1.18vw,13px);line-height:1.12}.order.vip{border-color:#e0a523;background:#fff8d9}.order.special{border-color:#e3b431;background:#fff0a5}.order strong{display:block;color:#9c3466;font-size:clamp(9px,1.25vw,13px);white-space:nowrap}.order .items{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-height:66px;overflow-y:auto}.order .item{background:#ffe5f1;border-radius:5px;padding:1px 3px;font-weight:900;white-space:normal;overflow-wrap:anywhere}.patience{height:5px;border-radius:8px;background:#f4b9cb;overflow:hidden;margin-top:3px}.patience>div{height:100%;background:#55bc79;transition:width .3s linear}.counterTop{position:absolute;top:49%;left:0;width:100%;height:3%;background:linear-gradient(#fff,#f4b1ce);border-top:3px solid #b85d8c;border-bottom:3px solid #c76b97;z-index:3}.kitchen{height:50%;position:relative;z-index:2;background:linear-gradient(180deg,#ffedf5 0%,#ffe0ed 50%,#e9a6c6 100%);padding:1% 1.3%;display:flex;flex-direction:column;gap:5px}.kitchenRow{display:flex;gap:5px;flex:1;min-height:0}#ingredientRow{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:2px}#ingredientRow .station{flex:0 0 clamp(64px,9vw,100px)}.station{position:relative;flex:1;min-width:0;border:2px solid #d781a7;border-bottom:4px solid #b45d86;border-radius:12px;background:linear-gradient(#fffefd,#f9cfe2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;gap:1px;overflow:hidden;color:#733655;font-weight:900;font-size:clamp(9px,1.25vw,15px)}.station .emoji{font-size:clamp(17px,3vw,32px);line-height:1}.station .sub{font-size:clamp(8px,1vw,12px);color:#a55c7d;white-space:nowrap}.station.ready{background:linear-gradient(#f0ffea,#b7edac);border-color:#65b65d}.station.cooking{background:linear-gradient(#fff5d3,#ffdc8b);border-color:#d9a647}.station.locked{filter:grayscale(.65);opacity:.55}.station.active{outline:3px solid #f8b62c;background:linear-gradient(#fff6c9,#ffdf91)}.station .progress{position:absolute;bottom:0;left:0;height:5px;background:#f4a227;transition:width .1s linear}.serveRow{display:flex;align-items:center;gap:6px;justify-content:center;flex:1;min-height:0}.prep{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed #d579a6;border-radius:12px;background:#fff9fd;color:#954e72;font-weight:900;font-size:clamp(9px,1.2vw,13px);padding:3px;overflow:hidden}.prep.selected{border:3px solid #e8a52a;background:#fff4ca}.prep .food{font-size:clamp(16px,2.5vw,26px);white-space:nowrap}.prep .detail{font-size:clamp(8px,1vw,11px);white-space:nowrap;overflow:hidden;max-width:100%}.action{flex:0 0 auto;padding:6px 9px;font-size:clamp(10px,1.25vw,14px)}#toast{position:absolute;z-index:15;top:14%;left:50%;transform:translateX(-50%);background:#803f67ee;color:white;padding:7px 18px;border-radius:16px;font-size:clamp(12px,1.5vw,17px);font-weight:bold;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}#toast.show{opacity:1}.overlay{position:absolute;inset:0;z-index:20;background:#49233fc9;display:flex;align-items:center;justify-content:center;padding:2%;backdrop-filter:blur(3px)}.hidden{display:none!important}.panel{background:linear-gradient(#fffafc,#ffd9e9);border:5px solid #fff;border-radius:24px;outline:4px solid #d65c98;box-shadow:0 10px 30px #2711258c;padding:14px;max-height:95%;overflow:auto;width:min(740px,94vw);text-align:center}.panel h1{font-size:clamp(24px,4vw,45px);margin:2px 0;color:#d04485;text-shadow:2px 2px white}.panel h2{font-size:clamp(20px,3vw,30px);margin:2px 0;color:#c44880}.panel p{margin:7px;font-size:clamp(12px,1.5vw,17px)}.panel .buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.panel .buttons button{font-size:clamp(13px,1.8vw,20px);padding:8px 17px}.shopGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;text-align:left}.shopItem{background:#fff;border:2px solid #ef9cbe;border-radius:13px;padding:7px;display:flex;flex-direction:column;gap:3px;font-size:clamp(10px,1.2vw,14px)}.shopItem b{color:#bd3979}.shopItem button{font-size:clamp(10px,1.15vw,14px)}.help{font-size:clamp(10px,1.25vw,14px);line-height:1.35}.logoCat{font-size:clamp(30px,5vw,60px)}.scoreFlash{position:absolute;z-index:12;left:50%;top:35%;font-size:26px;color:#ffd34f;font-weight:1000;text-shadow:2px 2px #813e5e;animation:float .9s forwards;pointer-events:none}@keyframes float{to{transform:translateY(-55px);opacity:0}}@media(orientation:portrait){#rotate{display:flex}#game{display:none}}@media(max-height:420px){.panel{padding:8px}.panel p{margin:4px}.shopGrid{gap:4px}.shopItem{padding:4px}.station{border-radius:7px}.prep{border-radius:7px}.order{padding:2px}}
</style></head><body><div id="rotate">↻<br>Turn your phone sideways to play<br>Alison's Cat Cafe 🐱</div><div id="game"><header id="header"><div class="brand">🐾 Alison's Cat Cafe 🐟</div><div class="stats"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🏆 <span id="best">0</span></div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">❌ <span id="strikes">0</span>/3</div><button class="btn tiny" id="pauseBtn">Ⅱ Pause</button></div></header><div class="customerZone" id="customerZone"></div><div class="counterTop"></div><div class="kitchen"><div class="kitchenRow" id="cookRow"></div><div class="kitchenRow" id="ingredientRow"></div><div class="serveRow" id="prepRow"></div></div><div id="toast"></div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),SAVE='alison_cat_cafe_v1';
const defaults={coins:0,best:0,totalServed:0,up:{counter:0,fryer:0,speed:0,drinks:0,patience:0}};
let save;try{save=Object.assign({},defaults,JSON.parse(localStorage.getItem(SAVE)||'{}'));save.up={...defaults.up,...save.up}}catch{save=structuredClone(defaults)};
function persist(){try{localStorage.setItem(SAVE,JSON.stringify(save))}catch{}}
const menu={sticks:{name:'Fish Sticks',emoji:'🐟',base:15},burger:{name:'Fish Burger',emoji:'🍔',base:24},dog:{name:'Fish Dog',emoji:'🌭',base:22},cola:{name:'Berry Pop',emoji:'🥤',base:10},lemon:{name:'Lemon Fizz',emoji:'🍋',base:10},orange:{name:'Orange Splash',emoji:'🍊',base:10}};
const sauces={sticks:['Tartar','Ranch','Spicy'],burger:['Cheese','Lettuce','Pickles','Tartar','Ketchup'],dog:['Mustard','Relish','Ketchup','Onions']};
const humans=[{name:'Grant',hair:'#58352b',shirt:'#234a83',skin:'#f3c39e',kind:'human',glasses:false,mustache:true},{name:'Charboy',hair:'#e4c76b',shirt:'#181b24',skin:'#f5c9aa',kind:'human',wide:true},{name:'Lauren',hair:'#76503d',shirt:'#bca58d',skin:'#f4d1b5',kind:'human',glasses:true},{name:'Megan',hair:'#5c382d',shirt:'#8b8aaf',skin:'#f0c7aa',kind:'human',drool:true}];
const regularNames=['Mittens','Patches','Noodle','Biscuit','Whiskers','Mochi','Pickles','Pumpkin','Luna','Miso','Waffles','Clover','Pebbles','Tuna','Maple','Bean'];
const cats=[{breed:'Tabby',fur:'#d89a58',pattern:'#8e583c'},{breed:'Tuxedo',fur:'#323341',pattern:'#fff7ef'},{breed:'Persian',fur:'#fff3de',pattern:'#e4d7c3'},{breed:'Siamese',fur:'#ebd7b6',pattern:'#795d57'},{breed:'Calico',fur:'#f8e5d4',pattern:'#d78a50'},{breed:'Gray',fur:'#8e9aa8',pattern:'#5e687a'},{breed:'Bengal',fur:'#d9a46a',pattern:'#75513b'},{breed:'Sphynx',fur:'#e9a8a2',pattern:'#d48689'},{breed:'Maine Coon',fur:'#9b745d',pattern:'#664b44'}];
const vip=[{name:'Cheetah',fur:'#eac17a',pattern:'#6d5137',mult:2},{name:'Tiger',fur:'#ed9950',pattern:'#553c35',mult:3},{name:'Jaguar',fur:'#c9a16c',pattern:'#514135',mult:4},{name:'Lion',fur:'#dba765',pattern:'#9c683d',mult:5}];
const rand=(a,b)=>Math.random()*(b-a)+a,choose=a=>a[Math.floor(Math.random()*a.length)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let state='menu',score=0,served=0,strikes=0,elapsed=0,customers=[],cooks=[],preps=[],selected=0,nextCustomer=0,last=performance.now(),sequence=0,toastTimer,combo=0;
const maxPrep=()=>2+save.up.counter;const maxCustomer=5;
const costs={counter:[80,140,220,330],fryer:[160],speed:[100,180,290],drinks:[80,150,250],patience:[120,200,320]};
const upgradeInfo={counter:['🧺','Counter Space','One more preparation space (max 6)'],fryer:['🍳','Second Fish-Stick Fryer','Cook another batch of fish sticks'],speed:['🔥','Faster Fryers','Fish cooks faster'],drinks:['🥤','Faster Drinks','Drinks fill faster'],patience:['💗','Cozy Atmosphere','Customers wait a little longer']};
function notify(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1450)}
function updateHUD(){$('score').textContent=score.toLocaleString();$('best').textContent=save.best.toLocaleString();$('coins').textContent=save.coins.toLocaleString();$('strikes').textContent=strikes}
function panel(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden')}
function hidePanel(){$('overlay').classList.add('hidden')}
function showMenu(){state='menu';updateHUD();panel(`<div class="logoCat">🐱🐟💗</div><h1>Alison's Cat Cafe</h1><p>Welcome to the cutest fish restaurant in town!</p><p><b>🏆 Best score:</b> ${save.best.toLocaleString()} &nbsp; <b>🐾 Lifetime customers:</b> ${save.totalServed}</p><p>Cook fish meals, serve fashionable cats, and survive the endless rush!</p><div class="buttons"><button class="btn gold" data-action="start">▶ PLAY</button><button class="btn" data-action="shop">🛍️ KITCHEN SHOP</button><button class="btn" data-action="help">❔ HOW TO PLAY</button></div>`)}
function showHelp(){state='help';panel(`<h2>How to Play 🐾</h2><div class="help"><p><b>1.</b> Tap a fish fryer to cook fish. Tap again when it's green to collect it. Don't let it burn!</p><p><b>2.</b> Tap a prep space to select it. Add a burger bun 🍔 or hot dog bun 🌭 first, then cooked fish. Fish sticks go straight onto an empty tray.</p><p><b>3.</b> Tap the requested sauces and toppings. For drinks, tap a cup first, then a drink dispenser; collect when ready.</p><p><b>4.</b> Tap the matching customer's <b>order bubble</b> to serve the selected completed item. Each item is served separately.</p><p><b>5.</b> Serve quickly! Three customers leaving ends your run. Earn coins for permanent upgrades.</p><p><b>TIP:</b> Gold-suited BOY appears 1% of the time and pays 100×!</p></div><div class="buttons"><button class="btn" data-action="menu">BACK</button><button class="btn gold" data-action="start">PLAY</button></div>`)}
function showShop(from='menu'){state='shop';let cards=Object.entries(upgradeInfo).map(([key,[icon,name,desc]])=>{const level=save.up[key],price=costs[key][level],max=price===undefined;return `<div class="shopItem"><b>${icon} ${name}</b><span>${desc}</span><span>Level ${level}/${costs[key].length}</span><button class="btn ${max?'':'gold'}" data-buy="${key}" ${max||save.coins<price?'disabled':''}>${max?'MAXED':`🪙 ${price}`}</button></div>`}).join('');panel(`<h2>🛍️ Kitchen Upgrades</h2><p>🪙 ${save.coins.toLocaleString()} coins • Upgrades last between runs</p><div class="shopGrid">${cards}</div><div class="buttons"><button class="btn" data-action="menu">BACK TO MENU</button><button class="btn gold" data-action="start">▶ PLAY</button></div>`)}
function buy(k){const lv=save.up[k],cost=costs[k]?.[lv];if(cost===undefined||save.coins<cost)return;save.coins-=cost;save.up[k]++;persist();updateHUD();showShop();notify('Upgrade purchased!')}
function catSVG(c){const human=c.kind==='human',fur=c.fur||c.skin,pattern=c.pattern||c.hair,shirt=c.shirt||c.suit||choose(['#e8b0d0','#8db5d3','#b9a1db']);let ears=human?'':`<path d="M36 37 L26 9 Q24 4 33 12 L49 25 M64 25 L78 8 Q85 4 77 36" fill="${fur}" stroke="#65404b" stroke-width="2"/><path d="M34 26 L30 15 L43 28 M67 27 L76 15 L71 32" fill="#eaa3a8"/>`;let hair=human?`<path d="M28 35 Q25 7 52 9 Q78 7 75 40 L68 27 Q51 20 34 31Z" fill="${pattern}"/>`:'';let tail=human?'':`<path d="M71 99 Q101 106 90 77" fill="none" stroke="${fur}" stroke-width="12" stroke-linecap="round"/>`;let markings=human?'':`<path d="M39 20 L42 30 M51 18 L51 28 M64 20 L61 30" stroke="${pattern}" stroke-width="4" opacity=".85"/>`;let glasses=c.glasses?`<g fill="none" stroke="#5d474a" stroke-width="3"><circle cx="42" cy="43" r="9"/><circle cx="61" cy="43" r="9"/><path d="M51 43h1"/></g>`:'';let shades=c.special?`<path d="M33 38 h17 l-3 12 h-11z M54 38 h17 l-3 12 h-11z M49 40h5" fill="#202530" stroke="#e4ba39" stroke-width="2"/>`:'';let mouth=c.drool?`<path d="M50 59q8 7 14-1" fill="none" stroke="#703c48" stroke-width="2"/><path d="M59 62q-5 9 0 13q6-3 0-13" fill="#8dd8ee"/>`:`<path d="M47 60q5 5 10 0" fill="none" stroke="#6b4850" stroke-width="2"/>`;let coat=c.special?'#e7b52c':shirt;return `<svg viewBox="0 0 105 135" aria-hidden="true">${tail}<path d="M36 83 L25 126 L38 128 L49 100 L59 128 L74 126 L68 83" fill="#54455f"/><path d="M27 70 Q51 61 76 70 L81 112 L22 112Z" fill="${coat}" stroke="#724c65" stroke-width="2"/><path d="M26 74 L17 104 M77 74 L88 104" stroke="${coat}" stroke-width="12" stroke-linecap="round"/><path d="M17 104l-3 6 M88 104l3 6" stroke="${fur}" stroke-width="9" stroke-linecap="round"/>${ears}<ellipse cx="52" cy="44" rx="30" ry="31" fill="${fur}" stroke="#76515a" stroke-width="2"/>${markings}${hair}<ellipse cx="41" cy="45" rx="5" ry="6" fill="white"/><ellipse cx="63" cy="45" rx="5" ry="6" fill="white"/><ellipse cx="42" cy="45" rx="2.7" ry="4" fill="#34303b"/><ellipse cx="62" cy="45" rx="2.7" ry="4" fill="#34303b"/><path d="M49 54l6 0l-3 4z" fill="#b77c82"/>${mouth}${glasses}${shades}${c.mustache?'<path d="M45 57q-7-5-12 1q8 5 17 1q9 4 17-1q-7-6-12-1" fill="#58372f"/>':''}${c.wide?'<path d="M20 84 Q50 65 84 84" fill="none" stroke="#20232a" stroke-width="5"/>':''}<path d="M45 71l7 17l7-17" fill="#fff3ed" stroke="#fff3ed" stroke-width="2"/>${c.special?'<path d="M52 80l-4 12l4 11l5-11z" fill="#fff2a8"/>':''}<rect x="34" y="96" width="36" height="13" rx="3" fill="#fff9ee" stroke="#c38d7d"/><text x="52" y="105" text-anchor="middle" font-size="9" font-weight="900" fill="#623d50">${c.name.length>9?c.name.slice(0,9):c.name}</text></svg>`}
function newCustomer(){let c,roll=Math.random();if(roll<.01){c={name:'BOY',fur:'#dfb27c',pattern:'#8b5a44',special:true,kind:'cat',mult:100,patience:36}}else if(roll<.21){const vroll=Math.random();let v=vroll<.40?vip[0]:vroll<.70?vip[1]:vroll<.95?vip[2]:vip[3];c={...v,kind:'cat',vip:true,suit:choose(['#222e46','#3a333a','#4a2535']),patience:30+rand(0,12)}}else if(roll<.41){c={...choose(humans),patience:65}}else{const breed=choose(cats);c={...breed,name:choose(regularNames),kind:'cat',patience:60}}let count=c.special?1:c.name==='Megan'?5:clamp(1+Math.floor(elapsed/55)+Math.floor(rand(0,2)),1,Math.min(5,2+Math.floor(elapsed/55)));let order=[];for(let i=0;i<count;i++){let keys=Object.keys(menu),type=choose(keys);if(elapsed<20&&i===0)type=choose(['sticks','burger','dog']);let opts=sauces[type]||[],toppings=opts.length?Array.from({length:Math.min(opts.length,Math.floor(rand(0,Math.min(3,1+elapsed/100)+1)))},()=>choose(opts)):[];toppings=[...new Set(toppings)];order.push({type,toppings,id:sequence++})}c.order=order;c.remaining=order.slice();c.id=sequence++;c.maxPatience=(c.patience+count*9+save.up.patience*9)*(c.vip?.78:1);c.left=c.maxPatience;c.svg=catSVG(c);customers.push(c);renderCustomers()}
function itemText(item){return menu[item.type].emoji+(item.toppings.length?' '+item.toppings.join('/'): '')}
function renderCustomers(){const zone=$('customerZone');zone.innerHTML='';for(let i=0;i<maxCustomer;i++){let slot=document.createElement('div');slot.className='slot';const c=customers[i];if(c){let bubble=document.createElement('div');bubble.className='order '+(c.vip?'vip':'')+(c.special?' special':'');bubble.dataset.customer=c.id;bubble.innerHTML=`<strong>${c.special?'✨':c.vip?'💎':''}${c.name} ${c.mult?'×'+c.mult:''}</strong><div class="items">${c.remaining.map(it=>`<span class="item" title="${it.toppings.join(', ')}">${itemText(it)}</span>`).join('')}</div><div class="patience"><div id="pat-${c.id}" style="width:${c.left/c.maxPatience*100}%"></div></div>`;slot.appendChild(bubble);let figure=document.createElement('div');figure.className='customer';figure.innerHTML=c.svg;figure.onclick=()=>serve(c.id);slot.appendChild(figure)}zone.appendChild(slot)}}
function createCookers(){cooks=[{type:'fish',label:'Fish Fillet',emoji:'🐟',status:'empty',time:0,duration:4},{type:'sticks',label:'Fish Sticks',emoji:'🍤',status:'empty',time:0,duration:4},{type:'sticks',label:'Fish Sticks #2',emoji:'🍤',status:'empty',time:0,duration:4,extra:true},{type:'drink',label:'Drink Machine',emoji:'🥤',status:'empty',time:0,duration:2,flavor:null}]}
function emptyPrep(){return {base:null,fish:null,toppings:[],cup:false,drink:null}}
function resetRun(){score=0;served=0;strikes=0;elapsed=0;customers=[];preps=Array.from({length:maxPrep()},emptyPrep);selected=0;nextCustomer=1.5;combo=0;createCookers();state='playing';hidePanel();updateHUD();renderKitchen();renderCustomers();notify('Welcome to Alison’s Cat Cafe!')}
function cookTap(i){if(state!=='playing')return;let c=cooks[i];if(c.extra&&!save.up.fryer){notify('Buy the second fryer in the shop!');return}if(c.status==='empty'){if(c.type==='drink'){notify('Tap a cup, then choose a drink flavor!');return}c.status='cooking';c.time=0;c.duration=4/(1+save.up.speed*.22);notify('Cooking '+c.label)}else if(c.status==='ready'){let p=preps[selected];if(c.type==='drink'){if(!p.cup||p.drink){notify('Select an empty cup first!');return}p.drink=c.flavor;p.cup=false}else{if(p.fish){notify('This prep space already has fish!');return}if(c.type==='fish'&&!['burger','dog'].includes(p.base)){notify('Add a burger or hot dog bun first!');return}if(c.type==='sticks'&&p.base){notify('Use an empty tray for fish sticks!');return}p.fish=c.type}c.status='empty';c.time=0;c.flavor=null;renderKitchen();notify('Added to prep space '+(selected+1))}else if(c.status==='burned'){c.status='empty';c.time=0;renderKitchen();notify('Burnt food discarded!')}else notify('Still cooking!')}
function addBase(type){if(state!=='playing')return;const p=preps[selected];if(type==='cup'){if(p.base||p.fish||p.drink){notify('Choose an empty preparation space!');return}p.cup=true;notify('Cup ready — choose a drink!')}else{if(p.base||p.fish||p.cup||p.drink){notify('Choose an empty preparation space!');return}p.base=type;notify(type==='burger'?'Burger bun ready!':'Hot dog bun ready!')}renderKitchen()}
function startDrink(type){if(state!=='playing')return;let p=preps[selected],c=cooks[3];if(!p.cup||p.drink||p.base||p.fish){notify('Place an empty cup in your prep space first!');return}if(c.status!=='empty'){notify('Drink machine is busy!');return}c.status='cooking';c.flavor=type;c.time=0;c.duration=2/(1+save.up.drinks*.25);notify('Filling '+menu[type].name);renderKitchen()}
function addTopping(name){if(state!=='playing')return;let p=preps[selected];if(!p.fish){notify('Add cooked fish first!');return}if(p.toppings.includes(name)){p.toppings=p.toppings.filter(t=>t!==name);notify(name+' removed')}else{p.toppings.push(name);notify(name+' added')}renderKitchen()}
function prepType(p){if(p.drink)return p.drink;if(p.fish==='sticks')return 'sticks';if(p.fish==='fish'&&p.base)return p.base;return null}
function sameToppings(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function serve(id){if(state!=='playing')return;let c=customers.find(x=>x.id===id);if(!c)return;let p=preps[selected],type=prepType(p);if(!type){notify('Finish an item in the selected prep space!');return}let match=c.remaining.find(it=>it.type===type&&sameToppings(it.toppings,p.toppings));if(!match){notify('That item does not match this order!');return}c.remaining=c.remaining.filter(it=>it.id!==match.id);preps[selected]=emptyPrep();let base=menu[type].base*(c.mult||1),pay=Math.round(base*(.7+.3*c.left/c.maxPatience));save.coins+=pay;score+=100+Math.round(50*c.left/c.maxPatience)+(combo>=3?25:0);combo++;if(!c.remaining.length){customers=customers.filter(x=>x.id!==id);served++;save.totalServed++;score+=50;notify('Order complete! +'+pay+' coins')}else notify('Served! +'+pay+' coins');if(score>save.best)save.best=score;persist();updateHUD();renderCustomers();renderKitchen()}
function discard(){if(state!=='playing')return;preps[selected]=emptyPrep();renderKitchen();notify('Preparation cleared')}
function renderKitchen(){const cook=$('cookRow'),ingredients=$('ingredientRow'),prep=$('prepRow');cook.innerHTML='';cooks.forEach((c,i)=>{let b=document.createElement('button');b.className='station '+(c.status==='ready'?'ready':c.status==='cooking'?'cooking':'')+(c.extra&&!save.up.fryer?' locked':'');b.innerHTML=`<span class="emoji">${c.status==='burned'?'🔥':c.emoji}</span><span>${c.label}</span><span class="sub" id="cookstatus${i}">${c.extra&&!save.up.fryer?'🔒 SHOP':c.status==='empty'?'TAP TO COOK':c.status==='cooking'?'COOKING...':c.status==='ready'?'✓ TAP TO COLLECT':'BURNT! DISCARD'}</span><span class="progress" id="progress${i}" style="width:0"></span>`;b.onclick=()=>cookTap(i);cook.appendChild(b)});
const ingredientButtons=[['🍔','Burger Buns',()=>addBase('burger')],['🌭','Hot Dog Buns',()=>addBase('dog')],['🥛','Empty Cups',()=>addBase('cup')],['🫐','Berry Pop',()=>startDrink('cola')],['🍋','Lemon Fizz',()=>startDrink('lemon')],['🍊','Orange Splash',()=>startDrink('orange')],...['Cheese','Lettuce','Pickles','Tartar','Ketchup','Mustard','Relish','Onions','Ranch','Spicy'].map((s,i)=>[[ '🧀','🥬','🥒','🥣','🍅','🟡','🥒','🧅','🥛','🌶️'][i],s,()=>addTopping(s)])];ingredientButtons.forEach(([emoji,label,fn])=>{let b=document.createElement('button');b.className='station';b.innerHTML=`<span class="emoji">${emoji}</span><span>${label}</span>`;b.onclick=fn;ingredients.appendChild(b)});prep.innerHTML='';preps.forEach((p,i)=>{let b=document.createElement('button');b.className='prep '+(i===selected?'selected':'');let t=prepType(p),display=t?menu[t].emoji:p.cup?'🥛':p.base==='burger'?'🍔':p.base==='dog'?'🌭':'＋';let label=t?menu[t].name:p.cup?'Empty cup':p.base?'Bun ready':'Empty tray';b.innerHTML=`<span>Prep ${i+1}</span><span class="food">${display}</span><span class="detail">${label}</span><span class="detail">${p.toppings.join(' • ')||'Tap to select'}</span>`;b.onclick=()=>{selected=i;renderKitchen()};prep.appendChild(b)});let discardBtn=document.createElement('button');discardBtn.className='btn danger action';discardBtn.textContent='🗑️ Clear';discardBtn.onclick=discard;prep.appendChild(discardBtn)}
function update(dt){if(state!=='playing')return;elapsed+=dt;nextCustomer-=dt;const interval=Math.max(1.9,7.5-Math.sqrt(elapsed)*.45);if(nextCustomer<=0){if(customers.length<maxCustomer)newCustomer();nextCustomer=interval*rand(.75,1.3)}let changed=false;for(let i=customers.length-1;i>=0;i--){let c=customers[i];c.left-=dt;let bar=$('pat-'+c.id);if(bar){let pct=clamp(c.left/c.maxPatience*100,0,100);bar.style.width=pct+'%';bar.style.background=pct<30?'#e65a64':pct<60?'#e5b244':'#55bc79'}if(c.left<=0){customers.splice(i,1);strikes++;combo=0;changed=true;notify('A customer left! Strike '+strikes+'/3')}}for(let i=0;i<cooks.length;i++){let c=cooks[i];if(c.status==='cooking'||c.status==='ready'){c.time+=dt;if(c.status==='cooking'&&c.time>=c.duration){c.status='ready';changed=true}if(c.status==='ready'&&c.type!=='drink'&&c.time>=c.duration+7){c.status='burned';changed=true}let pr=$('progress'+i),label=$('cookstatus'+i);if(pr)pr.style.width=clamp(c.time/c.duration*100,0,100)+'%';if(label)label.textContent=c.status==='cooking'?Math.max(0,c.duration-c.time).toFixed(1)+'s':c.status==='ready'?'✓ READY!':'🔥 BURNT'}}if(changed){renderCustomers();renderKitchen();updateHUD()}if(strikes>=3)endRun()}
function endRun(){state='over';if(score>save.best)save.best=score;persist();updateHUD();panel(`<div class="logoCat">🐾🏆🐟</div><h1>Shift Over!</h1><p><b>⭐ Score:</b> ${score.toLocaleString()} &nbsp; <b>🐱 Customers served:</b> ${served}</p><p><b>🏆 Best score:</b> ${save.best.toLocaleString()} &nbsp; <b>🪙 Wallet:</b> ${save.coins.toLocaleString()}</p><p>Upgrade your kitchen and try to beat your record!</p><div class="buttons"><button class="btn gold" data-action="start">↻ PLAY AGAIN</button><button class="btn" data-action="shop">🛍️ SHOP</button><button class="btn" data-action="menu">MAIN MENU</button></div>`)}
function pause(){if(state!=='playing')return;state='paused';panel(`<h2>⏸️ Paused</h2><p>Score: ${score.toLocaleString()} • Served: ${served}</p><p>Your cats will wait until you return.</p><div class="buttons"><button class="btn gold" data-action="resume">▶ RESUME</button><button class="btn danger" data-action="quit">END RUN</button></div>`)}
$('pauseBtn').onclick=pause;$('overlay').addEventListener('click',e=>{const buyBtn=e.target.closest('[data-buy]');if(buyBtn){buy(buyBtn.dataset.buy);return}const btn=e.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case 'start':resetRun();break;case 'menu':showMenu();break;case 'shop':showShop();break;case 'help':showHelp();break;case 'resume':state='playing';hidePanel();break;case 'quit':endRun();break}});
$('customerZone').addEventListener('click',e=>{let el=e.target.closest('[data-customer]');if(el)serve(Number(el.dataset.customer))});
function frame(now){let dt=Math.min((now-last)/1000,.08);last=now;update(dt);requestAnimationFrame(frame)}
createCookers();preps=Array.from({length:maxPrep()},emptyPrep);renderKitchen();renderCustomers();showMenu();requestAnimationFrame(frame);
})();
</script></body></html>
